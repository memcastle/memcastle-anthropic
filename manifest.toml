format = 1
memcastle = ">=0.4, <0.6"

[plugin]
id = "anthropic"
version = "0.1.0"
provider = "anthropic"
description = "Claude Code history and lifecycle integration"
repository = "https://github.com/memcastle/memcastle-anthropic"
license = "MIT"


[[modules]]
id = "claude"
type = "source"
version = "0.1.0"
manifest = "sources/claude/memcastle-source.toml"
entry = "sources/claude/source.wasm"
contract = "0.4.0"


[[modules]]
id = "claude-code"
type = "integration"
version = "0.1.0"
manifest = "integrations/claude-code/memcastle-integration.toml"
entry = "integrations/claude-code/dist/index.js"

[checksums]
