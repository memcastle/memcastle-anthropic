# git-tpl — https://noirbizarre.github.io/git-tpl/configuration/
#
# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/memcastle/memcastle-plugin.tpl"

[answers]
codecov = true
codecov_covered_integrations = []
codecov_covered_sources = ["claude"]
codecov_integration_target = "80%"
codecov_patch_target = "80%"
codecov_project_target = "80%"
codecov_source_target = "81%"
core_versions = ["main"]
description = "Claude Code history and lifecycle integration"
gh_ship = true
github_owner = "memcastle"
integration_template = "https://github.com/memcastle/memcastle-integration.tpl"
integrations = ["claude-code"]
memcastle = ">=0.4, <0.6"
plugin_id = "anthropic"
provider = "anthropic"
repository_name = "memcastle-anthropic"
ship_token = "app"
source_template = "https://github.com/memcastle/memcastle-source.tpl"
sources = ["claude"]

[[composed]]
from = "sources"
source = "https://github.com/memcastle/memcastle-source.tpl"
ref = "main"
commit = "5f2a8350bd82c49ec2370d70c83019ff6fc5a822"

[[composed]]
from = "integrations"
source = "https://github.com/memcastle/memcastle-integration.tpl"
ref = "main"
commit = "d055d87eeba173e56ba0c84bc25c8ddeaeeaa0da"
